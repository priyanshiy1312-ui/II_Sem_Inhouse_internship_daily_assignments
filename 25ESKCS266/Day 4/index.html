!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="Admission-card" id="my-form">
    <h1 class="heading">College Admission Form</h1>
    <br>
     <button id="theme-toggle">🌙 Dark Mode</button>
     <br>
     <form>
    <div class="name">
    <label>Full Name</label>
    
    <input type="text" placeholder="Enter your name" required>
    <span class="error"></span>
    </div>
    <br>
    <br>
    <div class="email">
    <label>Email</label>
    
    <input type="email" placeholder="Enter email" required>
    <span class="error"></span>
    </div>
    <br>
    <br>
    <div class="password">
    <label>Password</label>
    
    <input type="password" placeholder="Enter password" required>
    <span class="error"></span>
    
    </div><br><br>
    <div class="confirmPassword"> 
    <label>Confirm Password</label>
    <input type="password" placeholder="Enter password" required>
    <span class="error"></span>
    </div>
    <br><br>
    <div class="no">
    <label>Mobile Number</label>
    
    <input type="tel" placeholder="Enter mobile number" required></div>
    <span class="error"></span>
    <br><br>
    <div class="dob">
    <label>Date of Birth</label>
    
    <input type="date" placeholder="DOB" required></div>
    <br><br>
    
    <div class="gender">
    <label>Gender</label>
    
    
    <input type="radio" name="gender">Male<br>
    <input type="radio" name="gender">Female<br>
    <input type="radio" name="gender">Other<br>
    </div><br>
    <div class="skill">
    <label>Skills</label>
    
    <input type="checkbox" name="skill">HTML<br>
    <input type="checkbox" name="skill">CSS<br>
    <input type="checkbox" name="skill">JavaScript<br>
    <input type="checkbox" name="skill">PHP<br>
    </div>
    <br><br>
    <div class="resume">
    <label>Upload Resume</label>
    
    <input type="file" name="resume" ></div>
    <br>
    <br>
    <div class="about-your">
    <label >About Yourself</label>
    
    <input  class="about" type="textarea" placeholder="write something about yourself">
    <br>
    </div>
    <br><br>
    <button type="submit" id="mybtn">Register</button>
   </div> 
</form>
   <script src="script.js"></script>
</body>
</html>
